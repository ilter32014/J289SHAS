name: Direct Tailscale SSH

on:
  workflow_dispatch:
    inputs:
      ssh_password:
        description: 'SSH Baglanti Sifreniz'
        required: true
        default: 'GucluBirSifre123!'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: SSH Sunucusunu Yapilandir ve Baslat
        run: |
          echo "runner:${{ github.event.inputs.ssh_password }}" | sudo chpasswd

          sudo mkdir -p /etc/ssh/sshd_config.d
          cat << 'EOF' | sudo tee /etc/ssh/sshd_config.d/99-custom-tunnel.conf > /dev/null
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          PermitRootLogin yes
          EOF

          sudo sshd -t
          sudo service ssh restart
          sudo service ssh status --no-pager

      - name: Tailscale Kur ve Aga Baglan
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-runner-ssh

      - name: Baglanti Bilgilerini Yazdir ve Oturumu Acik Tut
        run: |
          echo "=========================================="
          echo "Tailscale SSH hazir!"
          echo "Kullanici Adi: runner"
          echo "Sifre: ${{ github.event.inputs.ssh_password }}"
          echo "Dogrudan Baglanti: ssh runner@gh-runner-ssh"
          echo "=========================================="

          # Job'in hemen kapanmamasi icin bekle
          sleep infinity
