name: Serveo SSH Tunnel

on:
  workflow_dispatch:
    inputs:
      ssh_password:
        description: 'SSH Baglanti Sifreniz'
        required: true
        default: 'GucluBirSifre123!'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: SSH Sunucusunu Yapılandır ve Başlat
        run: |
          echo "runner:${{ github.event.inputs.ssh_password }}" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Serveo TCP Tünelini Aç ve Bağlantı Komutunu Göster
        run: |
          echo "=========================================="
          echo "SSH baglantisi kuruluyor..."
          echo "Kullanıcı Adı: runner"
          echo "Şifre: ${{ github.event.inputs.ssh_password }}"
          echo "=========================================="
          
          # Serveo ile 22. portu dışarı açıyoruz ve bağlantı adresini alıyoruz
          ssh -o StrictHostKeyChecking=no -R 0:localhost:22 serveo.net
